frr defaults traditional
hostname nf-core
service integrated-vtysh-config
!
interface eth1
 ip address 10.81.254.1/30
!
interface eth2
 ip address 203.0.113.1/30
!
! Internal range is reachable via the gateway firewall
ip route 10.81.0.0/16 10.81.254.2
! Default route represents the path to "the internet" node used for
! internet-bound public fixtures (NET-09/13/15/18/20 etc.)
ip route 0.0.0.0/0 203.0.113.2
!
line vty
