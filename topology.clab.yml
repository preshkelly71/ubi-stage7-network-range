name: soc-a3-d81
# UBI Stage 7 - Seven-Zone Enterprise Range
# Assignment set D4 | Address plan second octet 81 | Evidence marker UBI-A7-DEAAAB67E594

topology:
  nodes:
    internet:
      kind: linux
      image: soc-host:latest
      binds:
        - services/internet-init.sh:/init.sh:ro
      exec:
        - "ip address add 203.0.113.2/30 dev eth1"
        - "ip route add 10.81.0.0/16 via 203.0.113.1"
        - "sh /init.sh"

    core:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      binds:
        - configs/core/frr.conf:/etc/frr/frr.conf:ro
      exec:
        - "ip address add 203.0.113.1/30 dev eth2"

    gateway:
      kind: linux
      image: soc-gateway:latest
      binds:
        - configs/gateway/bootstrap.sh:/bootstrap.sh:ro
        - configs/gateway/nftables.conf:/etc/nftables.conf:ro
      exec:
        - "sh /bootstrap.sh"

    sensor:
      kind: linux
      image: soc-sensor:latest
      binds:
        - services/sensor-init.sh:/init.sh:ro
        - telemetry/suricata.yaml:/etc/suricata/suricata.yaml:ro
        - detections/suricata.rules:/var/lib/suricata/rules/suricata.rules:ro
        - evidence:/var/log/suricata
      exec:
        - "sh /init.sh"

    management:
      kind: linux
      image: soc-host:latest
      binds:
        - services/mgmt-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.10.10/27 dev eth1"
        - "sh /init.sh"

    finance:
      kind: linux
      image: soc-host:latest
      binds:
        - services/client-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.20.10/26 dev eth1"
        - "sh /init.sh 10.81.20.1"

    engineering:
      kind: linux
      image: soc-host:latest
      binds:
        - services/client-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.30.10/25 dev eth1"
        - "sh /init.sh 10.81.30.1"

    users:
      kind: linux
      image: soc-host:latest
      binds:
        - services/client-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.40.10/24 dev eth1"
        - "sh /init.sh 10.81.40.1"

    servers:
      kind: linux
      image: soc-servers:latest
      binds:
        - services/servers-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.50.10/27 dev eth1"
        - "sh /init.sh"

    guest:
      kind: linux
      image: soc-host:latest
      binds:
        - services/client-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.70.10/24 dev eth1"
        - "sh /init.sh 10.81.70.1"

    dmz:
      kind: linux
      image: soc-servers:latest
      binds:
        - services/dmz-init.sh:/init.sh:ro
      exec:
        - "ip address add 10.81.60.10/28 dev eth1"
        - "sh /init.sh"

  links:
    - endpoints: ["core:eth1", "gateway:eth1"]
    - endpoints: ["core:eth2", "internet:eth1"]
    - endpoints: ["gateway:eth2", "management:eth1"]
    - endpoints: ["gateway:eth3", "finance:eth1"]
    - endpoints: ["gateway:eth4", "engineering:eth1"]
    - endpoints: ["gateway:eth5", "users:eth1"]
    - endpoints: ["gateway:eth6", "servers:eth1"]
    - endpoints: ["gateway:eth7", "guest:eth1"]
    - endpoints: ["gateway:eth8", "dmz:eth1"]
    - endpoints: ["gateway:eth9", "sensor:eth1"]
    - endpoints: ["gateway:eth10", "sensor:eth2"]
