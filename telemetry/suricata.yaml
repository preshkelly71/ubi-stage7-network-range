%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[10.81.0.0/16]"
    EXTERNAL_NET: "!$HOME_NET"
af-packet:
  - interface: eth1
    cluster-id: 81
    cluster-type: cluster_flow
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types: [alert, flow, dns, http, tls, anomaly]
default-rule-path: /var/lib/suricata/rules
rule-files: [suricata.rules]
