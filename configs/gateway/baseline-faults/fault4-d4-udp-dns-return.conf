#!/usr/sbin/nft -f
# UBI Stage 7 - gateway segmentation policy (GOLDEN / correct version)
# Assignment set D4, address-plan second octet 81.
# Interfaces: eth1=core/wan  eth2=management  eth3=finance  eth4=engineering
#             eth5=users  eth6=servers  eth7=guest  eth8=dmz
#             eth9=sensor-span(no ip)  eth10=sensor-mgmt
#
# Design notes (see decision-log.md D-002):
#   - Default policy is drop on both input and forward: least privilege.
#   - Each zone's "established,related" return path is its OWN rule
#     (not one global rule) so a single baseline fault can remove exactly
#     one zone's return path without breaking the others (brief requires
#     "remove established-return handling on the finance path" in
#     isolation - see baseline-faults/fault1-finance-established.conf).
#   - Anti-spoof rules run before everything else per zone interface,
#     catching NET-28 (guest source-spoofed packet toward management).
#   - Sensor (eth9 span, eth10 mgmt-link) is deny-all as a source; it may
#     only be a destination for management-initiated collection (SSH).
#     This satisfies NET-30 and the public sensor-self-deny fixtures.

flush ruleset

table inet segmentation {

  # ---- reusable service port sets --------------------------------------
  set svc_dns_udp   { type inet_service; elements = { 53 } }
  set svc_dns_tcp   { type inet_service; elements = { 53 } }
  set svc_ntp       { type inet_service; elements = { 123 } }
  set svc_ssh       { type inet_service; elements = { 22 } }
  set svc_web_ok    { type inet_service; elements = { 443 } }
  set svc_web_deny  { type inet_service; elements = { 80 } }
  set svc_payroll_app { type inet_service; elements = { 8443 } }
  set svc_payroll_db  { type inet_service; elements = { 5432 } }
  set svc_code        { type inet_service; elements = { 9418 } }

  chain input {
    type filter hook input priority 0; policy drop;

    # loopback / self traffic
    iifname "lo" accept

    # return traffic to the gateway itself (e.g. sshd replies)
    ct state established,related accept

    # "network devices" admin path: only management may SSH into the
    # gateway's own control plane (NET-07 allow / NET-08 deny).
    iifname "eth2" ip saddr 10.81.10.0/27 tcp dport @svc_ssh ct state new,established counter accept comment "NET-07-mgmt-admin-to-gateway"

    counter log prefix "NF_INPUT_DENY " drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;

    # ---- anti-spoof ingress filtering (uRPF-lite), catches NET-28 ------
    iifname "eth2" ip saddr != 10.81.10.0/27  counter log prefix "NF_SPOOF_DENY " drop
    iifname "eth3" ip saddr != 10.81.20.0/26  counter log prefix "NF_SPOOF_DENY " drop
    iifname "eth4" ip saddr != 10.81.30.0/25  counter log prefix "NF_SPOOF_DENY " drop
    iifname "eth5" ip saddr != 10.81.40.0/24  counter log prefix "NF_SPOOF_DENY " drop
    iifname "eth6" ip saddr != 10.81.50.0/27  counter log prefix "NF_SPOOF_DENY " drop
    iifname "eth7" ip saddr != 10.81.70.0/24  counter log prefix "NF_SPOOF_DENY " drop
    iifname "eth8" ip saddr != 10.81.60.0/28  counter log prefix "NF_SPOOF_DENY " drop

    # ---- sensor isolation: deny-all as a source, no exceptions ---------
    # Covers NET-30 and the public sensor-to-sensor deny fixtures. This
    # must be evaluated before any other accept rule.
    iifname { "eth9", "eth10" } counter log prefix "NF_SENSOR_ISOLATION_DENY " drop

    # management may reach the sensor's collection link to pull evidence
    oifname "eth10" iifname "eth2" ip saddr 10.81.10.0/27 tcp dport @svc_ssh ct state new,established counter accept comment "mgmt-sensor-collection"

    # ---- D4 FAULT: udp dns return-state broken (see decision-log D-004) --
    udp sport 53 ct state established,related counter log prefix "NF_D4_UDP_DNS_RETURN_DROP " drop

    # ---- per-zone established/related return paths ---------------------
    # NET-29 exercises the users rule explicitly; each zone below is
    # independent so a fault can disable exactly one.
    oifname "eth2" ct state established,related counter accept comment "return-management"
    oifname "eth3" ct state established,related counter accept comment "return-finance"
    oifname "eth4" ct state established,related counter accept comment "return-engineering"
    oifname "eth5" ct state established,related counter accept comment "return-users"
    oifname "eth6" ct state established,related counter accept comment "return-servers"
    oifname "eth7" ct state established,related counter accept comment "return-guest"
    oifname "eth8" ct state established,related counter accept comment "return-dmz"
    oifname "eth1" ct state established,related counter accept comment "return-wan"

    # ---- D4 marker (inert in golden build) ------------------------------
    # The golden ruleset intentionally does NOT contain the D4 defect.
    # baseline-faults/fault4-d4-udp-dns-return.conf inserts:
    #   udp sport 53 ct state established,related drop
    # ABOVE the "return-servers" rule above, breaking only UDP DNS
    # replies while TCP DNS (dport 53 tcp) keeps working through the
    # same established rule.

    # ---- management administrative paths (explicit allow-list) --------
    # Management may initiate admin SSH only into the zones the brief
    # explicitly allows. Guest is explicitly denied (NET-23).
    iifname "eth2" ip saddr 10.81.10.0/27 oifname "eth3" tcp dport @svc_ssh ct state new,established counter accept comment "NET-22-mgmt-to-finance-admin"

    # ---- centralized DNS / NTP dependency (finance only) ----------------
    # address-plan.csv note: "finance may reach payroll app and DNS/NTP".
    # Guest and users resolve DNS externally via the internet uplink
    # instead (NET-01, NET-13 below) - they are deliberately NOT wired
    # into the internal resolver, keeping less-trusted zones off the
    # internal DNS/NTP infrastructure entirely.
    iifname "eth3" oifname "eth6" udp dport @svc_dns_udp counter accept comment "central-dns-udp-finance"
    iifname "eth3" oifname "eth6" tcp dport @svc_dns_tcp ct state new,established counter accept comment "central-dns-tcp-finance-D4-target"
    iifname "eth3" oifname "eth6" udp dport @svc_ntp counter accept comment "central-ntp-finance"

    # ---- users -> servers NTP (enables a genuine, provable NET-29
    # established-return check; see decision-log.md D-005 for why a real
    # service was used instead of synthetically injecting a conntrack
    # entry - real packet evidence beats a manufactured one) -------------
    iifname "eth5" oifname "eth6" udp dport @svc_ntp counter accept comment "NET-29-users-ntp-return-proof"

    # ---- finance <-> servers (NET-04, NET-16, NET-06 deny by omission) -
    iifname "eth3" oifname "eth6" tcp dport @svc_payroll_app ct state new,established counter accept comment "NET-04-finance-to-payroll-app"
    iifname "eth3" oifname "eth6" tcp dport @svc_payroll_db  ct state new,established counter accept comment "NET-16-finance-to-payroll-db"

    # ---- engineering <-> servers (NET-05; NET-06-style deny by omission)
    iifname "eth4" oifname "eth6" tcp dport @svc_code ct state new,established counter accept comment "NET-05-engineering-to-code-service"

    # ---- dmz <-> servers relay (NET-11 allow assigned port / NET-24 deny
    # nonassigned port is enforced simply by omission - only 5432 is
    # listed here, any other destination port falls through to the
    # default drop and is logged there) -------------------------------
    iifname "eth8" oifname "eth6" tcp dport @svc_payroll_db ct state new,established counter accept comment "NET-11-dmz-to-servers-assigned-port"

    # ---- guest -> internet only (NET-01) -------------------------------
    iifname "eth7" oifname "eth1" udp dport @svc_dns_udp counter accept comment "NET-01-guest-dns"
    iifname "eth7" oifname "eth1" tcp dport @svc_web_ok ct state new,established counter accept comment "NET-01-guest-https"

    # ---- users -> internet (NET-13 dns allow, NET-14 http deny by
    # omission, NET-15 https allow) --------------------------------------
    iifname "eth5" oifname "eth1" udp dport @svc_dns_udp counter accept comment "NET-13-users-dns"
    iifname "eth5" oifname "eth1" tcp dport @svc_web_ok ct state new,established counter accept comment "NET-15-users-https"

    # ---- engineering -> internet package repo (NET-18 allow, NET-19 ssh
    # deny by omission) ---------------------------------------------------
    iifname "eth4" oifname "eth1" tcp dport @svc_web_ok ct state new,established counter accept comment "NET-18-engineering-pkg-repo"

    # ---- servers -> internet software update (NET-20) ------------------
    iifname "eth6" oifname "eth1" tcp dport @svc_web_ok ct state new,established counter accept comment "NET-20-servers-software-update"

    # ---- internet -> dmz public web (NET-09 allow 443, NET-26 deny 80 by
    # omission, NET-27 deny ssh by omission) ------------------------------
    iifname "eth1" oifname "eth8" tcp dport @svc_web_ok ct state new,established counter accept comment "NET-09-internet-to-dmz-web"

    # dmz -> internet is NOT opened (NET-25 arbitrary outbound TCP deny).
    # dmz -> servers is limited to the assigned relay port only (above).

    # everything else is denied and logged with a locatable prefix/counter
    counter log prefix "NF_SEGMENT_DENY " drop
  }
}
